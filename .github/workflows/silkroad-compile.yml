name: Silkroad Remastered - Compile

on:
  push:
    branches: [silkroad-remastered]
  pull_request:
    branches: [silkroad-remastered]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile game server and dependencies
        run: mvn -B -pl game-server -am -DskipTests package
