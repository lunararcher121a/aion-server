name: Silkroad Remastered - Compile

on:
  push:
    branches: [silkroad-remastered]
  pull_request:
    branches: [silkroad-remastered]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile game server and dependencies
        run: |
          set -o pipefail
          mvn -B -pl game-server -am -DskipTests package 2>&1 | tee silkroad-build.log
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silkroad-compile-log
          path: silkroad-build.log
          if-no-files-found: warn
