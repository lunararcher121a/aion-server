name: Silkroad offline import tests

on:
  push:
    branches: [silkroad-remastered]
    paths:
      - 'tools/silkroad/**'
      - '.github/workflows/silkroad-import-tests.yml'
  pull_request:
    paths:
      - 'tools/silkroad/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OpenSRO importer and region mapping unit tests
        run: python -m unittest discover -s tools/silkroad -p 'test_*.py' -v
      - name: Syntax-check importer modules
        run: python -m compileall -q tools/silkroad
